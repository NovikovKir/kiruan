version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
      - mssqlfiles:/var/opt/mssql-files
      - ./backups:/var/opt/mssql-files/backups

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=MoviePlatform;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      AdminSettings__Email: "admin@example.com"
      AdminSettings__Password: "Admin123!"
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mssqldata:
  mssqlfiles:
